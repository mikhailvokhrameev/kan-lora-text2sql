[project]
name = "kan-lora-text2sql"
version = "0.1.0"
description = "Сравнение нелинейной низкоранговой адаптации KAN-LoRA с LoRA и DoRA в задаче генерации SQL-запросов"
requires-python = ">=3.10"

# torch>=2.14 требуется из-за torch.optim.Muon.
# Внимание: на GTX 1080 Ti (Pascal, sm_61) поддержка сборкой PyTorch под CUDA
# не гарантирована и проверяется скриптом scripts/check_environment.py.
dependencies = [
    "torch>=2.14",
    "transformers>=4.46",
    "datasets>=3.0",
    "accelerate>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kanlora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
